<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrarse</title>
    <link rel="stylesheet" href="../css/Registrarse.css">
</head>

<body>

<div class="contenedor">

    <div class="izquierda">
        <img src="../imagenes/logo.png" alt="Logo" class="logo">

        <h1>Crear una cuenta</h1>
        <p>Regístrate para acceder a A.M.L.B</p>

        <a href="../html/portada.html" class="boton-inicio">
            Volver al inicio
        </a>
    </div>

    <div class="derecha">

        <form>

            <label>Nombre de usuario</label>
            <input type="text" placeholder="Ingrese un nombre de usuario">

            <label>Contraseña</label>
            <input type="password" placeholder="Cree una contraseña">

            <label>Confirmar contraseña</label>
            <input type="password" placeholder="Repita la contraseña">

            <button type="submit">Registrarse</button>

            <p>¿Ya tienes una cuenta?</p>

            <a href="../html/IniciarSecion.html">Iniciar sesión</a>

        </form>

    </div>

</div>

</body>
</html>
